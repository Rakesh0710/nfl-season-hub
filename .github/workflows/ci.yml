name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit and component tests
        run: npm run test

      - name: Production build
        run: npm run build

      # The bundle is the product here — there is no server to hide behind — so
      # its size is reported on every run rather than discovered at release.
      - name: Report bundle size
        run: |
          echo '### Bundle' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for file in dist/assets/*.js dist/assets/*.css; do
            printf '%-44s %8d raw %8d gzip\n' \
              "$(basename "$file")" "$(wc -c <"$file")" "$(gzip -c "$file" | wc -c)" \
              >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  data:
    name: Validate the generated data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The validator is stdlib-only and reads the committed JSON, so this
      # needs no ETL run and no nflverse download. It enforces the same
      # contract the TypeScript parsers do, from the producing side.
      - name: Validate against the contract
        run: python etl/validate.py --data public/data

      # The refresh runs unattended on a schedule, so the two decisions it
      # makes alone — which season to describe, and what happens to games
      # already in the index — are fault-injected rather than trusted.
      - name: Fault-inject the refresh guardrails
        run: python etl/test_refresh.py

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The config builds the app and serves it with `vite preview`, so this
      # runs against the production bundle rather than the dev server.
      - name: Run Playwright
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
